<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Local App</title>
    <style>
        body {
            background-color: #333;
            color: #fff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        h1 {
            text-align: center;
        }
        .action-button {
            background-color: #007bff;
            color: #fff;
            border: none;
            padding: 10px 20px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            margin: 4px 2px;
            cursor: pointer;
            border-radius: 5px;
        }
        .toast {
            background-color: #4caf50;
            color: #fff;
            padding: 10px 20px;
            text-align: center;
            border-radius: 5px;
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: none;
        }
        .gif-container {
            display: none;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>My First Local App</h1>
    <button class="action-button" onclick="showGif()">Click Me</button>
    <div class="gif-container" id="gifContainer">
        <img src="path/to/leocheers.gif" alt="Leo Cheers">
    </div>

    <script>
        function showGif() {
            const gifContainer = document.getElementById('gifContainer');
            gifContainer.style.display = 'block';
        }
    </script>
</body>
</html>
